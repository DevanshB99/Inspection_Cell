ur5e:
  # DIAGNOSTIC (servo branch-jump): switched from CachedKDLKinematicsPlugin to plain KDL.
  # MoveIt Servo's jointDeltaFromIK calls searchPositionIK(seed=current_joint_positions,
  # timeout=publish_period/2=1ms, return_approximate_solution=true) and returns
  # delta_theta = solution - current. The Cached plugin overrides the provided seed with
  # the nearest cached solution, which can be a different IK branch, producing a large
  # delta on elbow/wrist_1/wrist_3 that /publish_period(0.002) saturates at +/-pi. Plain
  # KDL respects the provided seed, so a near-current target stays near current.
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.0050000000000000001
  kinematics_solver_timeout: 0.0050000000000000001