# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    # - ur5e_controller
    # - turntable_trajectory_controller
    - inspection_cell_controller

  ur5e_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

  turntable_trajectory_controller:
    type: FollowJointTrajectory
    joints:
      - turntable_disc_joint
    action_ns: follow_joint_trajectory
    default: true

  inspection_cell_controller:
    type: FollowJointTrajectory
    joints:
      - turntable_disc_joint
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    default: true
    action_ns: follow_joint_trajectory  
  # Second arm. move_group.launch.py adds it to controller_names when dual_arm:=true.
  zivid_inspection_cell_controller:
    type: FollowJointTrajectory
    joints:
      - turntable_disc_joint
      - zivid_shoulder_pan_joint
      - zivid_shoulder_lift_joint
      - zivid_elbow_joint
      - zivid_wrist_1_joint
      - zivid_wrist_2_joint
      - zivid_wrist_3_joint
    default: true
    action_ns: follow_joint_trajectory
